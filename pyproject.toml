[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "q-route"
version = "0.1.0"
description = "Phase 1 foundation for quantum-inspired multi-objective traffic routing"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
q-route = "qroute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
